services:
  crb65-pneumonia-severity:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUDIT_SECRET_KEY: "${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY in .env before starting the service}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-mock}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
