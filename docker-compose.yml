version: '3.8'

services:
  crb65-pneumonia-severity:
    build: .
    container_name: crb65-pneumonia-severity
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=crb65-pneumonia-severity-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
