name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Syntax and lint checks
        run: |
          python -m compileall -q .
          ruff check .
      - name: Test suite
        env:
          AUDIT_SECRET_KEY: ci-test-key-not-for-production
        run: pytest -q
      - name: Dependency consistency
        run: python -m pip check

  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit/build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Dependency vulnerability audit
        run: pip-audit --local --skip-editable
      - name: Build Python distributions
        run: python -m build
      - name: Build container
        run: docker build -t crb65-pneumonia-severity:ci .
